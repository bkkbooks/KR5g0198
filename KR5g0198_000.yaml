  text: 上清高聖太上大道君洞真金元八景玉籙東華上仙曰太上八素隱書南華上仙曰大洞真經西華上仙曰金真玉光映天洞觀玉經北華上仙曰蕭條九曜豁落七玄上經玉皇中華上仙曰太上高聖八景玉籙中央黃老君南極元君藏録二經於太素瑶臺玄雲羽室封以鬱森之笈玉清三元之章乃命北寒金臺龍華玉女七百人又命白空虞宫西靈玉童七百人侍衛大洞真經及太上虛生大隱符玉籙焉上清高聖太上大道君者蓋二晨之精氣慶雲之紫煙玉暉曜焕金映流真結化含秀苞凝玄神寄胎母氏育形為人諱𠔬字上開元母妊三千七百年誕於西那天鬱察山浮羅嶽丹玄之阿側矣元監朗於始旦八洞被於太初周觀九緯俯濯醴川逍遙攝生採真食精飛玄揚羽漱挹泰明受籙紫皇位司高仙振風朱素朝會萬神玄淵峨岑大音彌芬希想玉真之虛霞上清之靈晨爾乃拔思眇慕蹈空栖真沉朱華璋解冠九天眄朗丘嶽極洞萬峰神秉五曜形磐七元感精太寂思招玄清遂浩映渟暉飛珠濯靈隱芝結秀寶光夜生朝探華晨餐晨上精乘雲落煙八道焕明神電回風緑氣幽藹廣眄八浩九元匝至再登紫陛三飛瓊闕四賓太素五宴琳室携握五老洞源極密高尊上帝莫不履此慧暢玉篇咀嚼沖味徘徊幽虛嚮流逸霄形沉八玄韜光萬源浩浩冥貫條條霞摽神秀外覺氣彌淡州容與大化寥廓本無太空任寄即色隨消淳風滿峙恬機理愈天音朗解高塗窈窕玄心充於希韻飛翰蔚乎慶煙龍潜一勃鳳儀眇扇遂撫四大揔括弱喪於是受書玉虛眺景上清位為太上高聖玉晨大道君治蘂珠日闕館七映紫房玉童玉女各三十萬人侍君散香焉佩九色離羅之帔衣飛森霜珠之袍巾須臾百變之冠帶晨光日鈴育精之劎下極萬萬受事虛皇也君或纍變常流順風入藹鼓揚三道下眄八外登乎丘阜杖褐萬國玄唱四振領拔宏致鵬翮八撫和音流萃委彼雲霞之上韻暫釋一往之眇蔚俯攝蒼梨亹亹彌邁夫决疑朗惑欽範靈德曜龍文於蒼淵焕采雲於川澤濯天貌於蘭玉發金精於幽谷乘大順以御至象遊冥神以混五濁虛澄九落勞不止足凝形泊中提携榮辱實太上之曲教也若其耽栖靈觀洞宴七覺機芒飈末測神盡奧弘模瀠渟虛遷幽間神浪希夷九音以懸玄寂既忘託寓華園照照法標明明功全妙激重理扉洞萬千儛景扇虛乘空抱煙磐紆七紀籙首上緣靈符曜散敷陳隱篇括致沉蒙運轉滯輪綜結五象携領諸天實太上之化理以視於羣方也若夫散教養形赴救神氣明立三宫沖靈獨泰寥朗二順含元嘉會遣撤雜思忘纍遣外行洞幽虛積妙成大吐故受新攝精逐穢除邪念之紛交藏真正之寶貴漱晨華以招日皇挹夜明以抱月珠鬱儀橫運焕啓太無結璘吸霄雙景合逰飛芝葩玄靈若被岫鳳腦鼓翼於金曆驎精奮耳以振軀夜光焕乎五嶽晃朗垂條而結華隱龍鳴雲瓊子竦遘於是靈瓜漫壟紫㮈鬱丘丹散千合玉密懸嵎蹀躞七元登空駕浮西靈浩漿東建醴朱酣丹琳可以遷九玄味虎沫足以嬰朽夫爰有四蘂紫津三華玄剛青瓶漂芝玄柯瑩琅素盈衝霄絳生五英挹玄渠之甘露變白首而方童矣若登峻嶺洪秀天和育明弱羅焕扇神柯晨榮縹蘂落林丹蘭敷靈嵉嵉巖虛飛煙奏香合谷獻葩芳液凝形紫碧絳雲金條艷精總根太華吐納七冥六慶揮慧八解寄成略略遠暢飄飄絶冥心泊節惔以回孫嬰也於是定覺造信明序等疇玉真啓晨沐浴靈丘清賓上朝精心豁愈蔚蔚三關偶景以綢寂幽內韻含唱高柔仗麾命仙研神步元歷落九天儼然整齊七聖表梯高風以標明範既維總運四浮也將有靜詠瓊堂愔玩大有靈風散景六雲生牖從容霄杪俯眄崇阜蕭條萬谷總轡空畒擲輪靈津飛獸嗥旅神童翼蓋西華宴石芬霧繞襟芳煙生乎寥寥嶽器金藏玉藪五象八廓澄景合偶遊觀隱奧是以永久也時復解帶萬流日遊月旋招風扇羽流蕩九遷明霞遂鏡暝暝重玄雲房含曜採真理間窈窕絶宅神洞寥間精暉內映三館潔鮮千痾不兆故有常痊遂爾振策七圃揚青建朱騰空儛旌駕景騁飈徘徊八煙盤桓空塗仰簪日華拾落月珠摘絳林之琅實餌玄河之紫蕖偃蹇靈軒領理帝書萬神入拜五德把符上真侍晨天皇抱圖太真四告中篇定模六紀流盈整氣攝虛於焉撫空仰玄吟唱而言曰子欲為真當存日中君駕龍驂鳳乘天景雲東遊希林遂入帝門若必升天當思月中夫人駕十飛龍乘我流零西朝六領遂詣帝堂精根運思上朝玉皇薈敷鬱儀以躡景晃散結璘以暨霄九緯橫擲七象電幽靈風交鼓二晨八道騁素以侍朝三雲焕華於北維萬龍騁騰以唱嘯東鵬鼓節紫華啓翹高奔圓精洞景逍遙雙皇合輦後天而雕也隱通坦陶神泯氣平靈賓森列披素玉庭左把龍符右操虎經八風洞虛流響五城玄黃焕落鬱若羅星三寶交扇步豪搜瑛高宗拔藻鎗鎗彈瓊玄音續拔金根琅砰鸞儛雲池飛鳳唱聲紫杜運蘭繞空繞靈躍踏太霞曜采上清發飈龍隧駭動八明纍椿積劫保兹利貞也或變教分道假名移形六一渴未玄雲育成飛丹水玉騰躍雪霜靈華八射紫游九揚徘徊亂轉曖昧三黃絳液易精九琳吐芒琅玕百變碧映水陽八瓊飛景秀蘂緑漿曲晨乘霄流金月明玄津玉醴靈映五公光弃投音一唱八張波若火精伊離玉薑金𨫼百會舍利縛香鬱鬱靈寶化易文章刀圭既陳壽不可量實真元之珍藥上帝之所祕藏也或鍊五雲玉華靈金餌清朱魄緑蕖華腴碧精南燭翠沉沙空青朝探五晨玉淵素漿亦能反故還新變老得嬰也於是四氣運和八風扇虛宴眄紫林振裳九隅扶桑鬱秀建木舞丘萬真逡巡濯翮滄流百草結柯五華曜敷蓂莢夕生合節而浮若登齊入室當先驅除以辟鬼病又防百試乃冥目內視拊心而祝北向叩齒三十六通有微言於玉清瓊元君曰六天大魔王受制幽寥無巨獸赤甲毒龍四喉白鷹仰鳴奮爪振豪萬精幽匿滅邪破妖天丁一怒五嶽啓朝風火征伐九天扇照矣於是重楗閉視練神密精調研三宫存一天庭帝君撰宴卿輔普明和適氣液朝謁九靈五神安疊津源流盈白元啓真無英布生洞景潜朗四德以平結暉內寶歌洞玩清太素列圖壽亦不傾也時復廣眄空同嗷嘈絶漢乘風振轡始暉滄畔演心八陔熙神獨粲登碧水之靈臺觀滄洲之紫館希悠眇眇霞飛煙散藹裔雲鏤翳勃晃爛偶景眺目倏欻萬旦虛音互騁玄風合讚扇元掣剛日華暐焕縱容霄漢所以永宴矣若採琳玄壟翦芝瓊園眇邈高真巍巍天尊玉華翼景金真繞轅絳波嶽踊躍心和鮮手落七曜澄回八門仰浮匏河俯步絶山領理上契咀嚼至玄把持法器懷精含神飄飄高肆順風隨新曇曇德模潜英啓全所以積椿久眄常保利津也或遇緑林茂崿逸景結丘逍遙玄覺觀化玉虛萬度非有本質在無軒飈神磐靈姬啓符羽裙渟霄翠帔翳舒高詠玉清講豪原初太微侍席五皇曜樞洞機宣幽至象合殊玉童彈璈北華啓筝天女羅陳百百齊并玄鈞四噦千音鏗零紫鳳撫翅漱籟同鳴雲鸞差池整喙唱聲神羽裙呼飛徵揚商蒼龍仰嗥叢雲鬱生神虎嘯咤八風扇庭撞金折玉拊鍾拍瓊朱煙蔽勃三素緑青圓精寢曜飛霞眄冥然後太帝下席散神縱靈眺眺霄符晃朗亭亭左揮南房右指文昌進趣奇蔚會節順翔窈窕衝晨蹀躞滄浪氣貫逸館羅袿拂空揚旄遏麾秉旗招光遷延內詠心和魂暢眄眸既周一至永長矣又各大唱妙幾論元理靈玉響八維金音振庭開陳太素敷誘隱冥衆藻扶疏微言續呈暉條森灑極妙之精旁遘岌叢以羣臻别柯棼羅以散榮有邁於閶闔之南映又似乎紅葩之繞梁流景之伊鬱飛煙之藹蒙曜九采於帝圖歌紫虛之雍雍廣聽嘈囐於玉臺擊石沸駭於金堂五雲纒蓋八素朗章招日月之高精命七宿之靈綱握節以步六天振朱紱之煒煌儛十絶於北燭麾華幡於白空乘神風以盼八景何事九鳳與八狼緑蓋眇眇以竦躍絳旌飄飄以逆衝九轡一疊躡霄雲驤摘青丹之蘂翹散飛華之反香懸梨五練而水柔九琳洞合而玉成火琅遂珠流金採瓊回勾陳之北阿落散晨之極星秉輪空同運氣而征巍峨奧真法恆數成有齊上契命何可傾若其元渟逰泮微音激清執玩三慧鑒攝黃寧浩哉聖玄微乎幽翰洞起無生空逸啓旌握固神庭纒綿靈關外夷四鏡寶在六元苕苕玉德形器欻延可謂溫和萬範順轡御圓也及至夕齡時栖方遂八易清淡抱生眇眇神迹婉延化理測幽極頥妙運奇絶寓翰汜適龍華駽焕於繡雲五映潜躍於太霞丹暉電曜景風扇和高會上宫泛浪虛波悠悠玄真濯氣玉河振披八道馨流霄阿乃為理玉日新不居是用積劫靈纍後無弗殂也爰有寶魂制魄凝神胞胎之法發數十言耳可以安身合道衆魔散却乃異天之絶祝祕宣龍燭之玄北其㫖不可得而演重言不可得而譯鳥音獸聲風纒雲落殊天幽唱莫能通釋若聊總領奇翰採氣洞宅領括九幽冥韻內廓乃玉音金流以施於南户之方矣本命之日及有心震之地閉關精思叩齒三過安氣呼吸正身北趣而心存微言曰羅勒那翰方奈閼練班目勃隧憚漢巨蛇赤察白象丹黎大魔真韻廣敷虛靈峙霄總覽吉凶發洞暢幽儛眄衆品領括繁條百方千塗莫不豁寥天地齊度孰云能雕也畢若夫决分萬滯剖堅散疑觸音合節四映顯丕天曜焕遷不傳不師八風回釋天帝陳辭曰羅來秀光玉虛四司激攄八坦秉安定危有生無營玄精致思悠豁極洞物非我持混形同采焉能及之嘉宴寒津坐起大夷二唱曰無三合五離大羅六慧空同九轉七清澄光四元繾綣體神忘覺萬慮非盡華文空肆玉朗雜軫廕雲重玄眇內輪隕七積動飈冥心遠泯細塵亂藹原宗歸大任形投空造神內外冥默妙篇自然高會沖靈獨鏡恢恢遠泰四律受氣雲澤修永九觀元元心亦豁靜虛煙牢落二晨焕頴雲梯遷適無轡而騁八界三道胡神以驚高德遠曜衆門運靈即空亦無作無兩名太玄一標支條由情幽寥照灼渟音和清二度七結及乃無生飈霄遏離有中頗虛大妙雖唱玄景未竦塵迹始豪坐與本無不貴常珍理歸漠愈大慧已釋與天同休萬事百向莫不會遇將有真妙玄致靈章無方恍惚奇洞高眄圓鄉擢此神音觸類在亡凛凛登霄芬芬運芳仰執軌度於絶間俯拯萬和於弱喪四輪揚暉真元眇遷大帥秉柂把籙明篇乘飈策景龍騰九天法鼓洞震瑋曄靈磐曜南宫之朱皇浮七蓋於玉津扇擲羽旗徘徊靈源緑雲掣旗北風振羣流鈴羅射飈皇生幡導達萬變應節扇煙朱虎俠景毒龍翼軒伺凶夫之失道威六天之大姦有惡必誅有吉必存千魔為之伏首山精為之自殘流響逸乎太空二景藹而落焕矣逍遙羣品泛形萬旦高極玉霄下盡杪散變化假體千術肆觀惠化衆兆各獲曩清上下蒼黎開括元生標名列籍致神測精有能施用飛登上清洞元詠微出幽入冥乃撰太上八景玉經羅真之妙闡帝之明子獲其篇號曰元景左卿思習洞道上清左公徊為三素逍遙紫空夫總億兆者將撫攝羣流軌運萬物周眄廣虛目朗八外盡空同之所宗遘玄暉之極蔚雲合遼涯風行煙萃罕得高靜霄霞指兩儀之修御也豈容默然三清任六氣以假適乎遂紼心坦觀熙靈十阿於是乃命八帝檄落萬靈告水源之陰甲召五皇之守君河海整嚴千真理輪火甲厲鋒天丁揮斤山嶽開塗日月照晨爾乃太上大道君將游行乎九霄眺神於外天採幽章於玉虛求隱符於紫皇明光八維略徹羣方者也於是太上大道君初乘一景之輿駕八素紫雲攝希微倉帝名籙豐子俱東行詣鬱悅那林昌玉臺天見玉清紫道虛皇上君受九暉大晨隱符太上大道君次乘二景之輿駕七素絳雲攝中微赤帝名定無彥俱南行詣高桃厲沖龍羅天見玉清翼日虛皇太上道君受觀靈元晨隱符太上大道君次乘三景之輿駕六素紅雲攝紫微白帝名渠淵石俱西行詣碧落空歌餘梨天見玉清昌陽始虛皇高元君受總晨九極隱符太上大道君次乘四景之輿駕五素青雲攝玄微黑帝名齊元旋俱北行詣𨚧摩坦婁于翳天見玉清七靜導生高上虛皇君受沓曜旋根隱符太上大道君次乘五景之輿駕四素黃雲攝始微上帝名接空子俱東北行詣扶刀蓋華浮羅天見玉清太明虛皇洞清君受玄景晨平隱符太上大道君次乘六景之輿駕三素緑雲攝靈微中帝名秉巨文俱東南行詣具渭耶渠初默天見玉清始元虛皇太霄君受合暉晨命隱符太上大道君次乘七景之輿駕二素紫雲攝宣微下帝君名宏膚子俱西南行詣沖容育鬱離沙天見玉清七觀無生虛皇金靈君受齊暉晨玄隱符太上大道君次乘八景之輿駕一素靈雲攝洞微真帝名泗澄攄俱西北行詣單緑察寶輪法天見玉清八觀高元虛皇渟景君受高上龍煙隱符太上大道君又乘洞景玉輿駕太霞紫煙玄景之暉攝九微內帝君名申明間及上皇九玄九天諸真仙王等俱仰登彌梵羅臺霄絶寥丘飛無雲根之都玉清上天見玉清紫暉太上玉皇明上大道君受高清太虛無極上道君隱符太上九遊之嚴矣佪騰之初也八景次駕八素運煙玉輿飛旗太霞繞輪引日合月俠輦揚軒五皇驅除發曜九天元剛把籙北極命神太帝啓道太素攝雲神虎七千以大嘯毒龍九百而開津猛獸唱塗六領銜山鷹禽奮爪斷羅萬姧九帝帶日景五嶽剖九關爰有火甲赫柏圓兵森羅執戈百丈踏阜傾河天丁武卒萬萬蜲蛇女騎千里落羽浮虛仰擲火鈴躍空晃流流金逆激焕裂八嵎威風洞源扶林拔株慶雲藹藹以玄竦龍霞幽羅以參扶帶七晨之夜景要九光之月珠黑虎甝號散揚天陳叩玉鳴鍾北酆啓旦明轡九衢寶香華散景輦擲霄八素儛軒千百萬塗黃衣師兵羽蓋浮空丹旗延精錦牙龍旄萬萬相傾飛煙薄日映鬱喪明五霞纒曜衝藹虛庭握節制魔揮劎步精龍人吹簫文虎奏筝玉鼓震雷九暉晝冥八狼御律齊音鏗鏗雲璈虛彈歷落宫商角羽納徵合空洞明神姬八百歌儛上清雲帔錦袂羽巾徊青右揮浩真左招晨桑窈窕雲陳翠華流星仿翔羅列交袂連頸潜濯太虛彈空吸景呼七道之紫煙流龍燭之熒熒萬盼極歡逍遙霄領邁霞超空淩厲玉城天鈞鳳音羽鸞唱鳴飛華雪灑夜日運精瓊華九節潔白如霜太桂生系掃拂圓明晨霞列轡三輪九軿沸洞虛玄顛倒杳冥大哉玉駕何靈德之至尊鬱矣霄景何飛蘂之蔚翰夫大音洞暢玉道幽邃高曜回明玄華朗蔚妙響却扇神姬列衛五老輔身進德益氣和魂攝精七魄受制洞仙虛真帝一尊貴於是司命齊飈公子同軿徊轡八塗流神九精五帝下迎上造上清北謁五帝唱詠洞經寢宴太素華羽圓明金妃詣房玉童散香讀訖於此心拜四方所以尊貴洞靈心願騰空也畢受大洞真經三十九章太上大道君玉籙八風徘徊帝一之道者當先清齊三年或清齊七百日或清齊一百四十日沐浴五香存真念仙玄心苦告稽首師門乃受之矣授經曰師君受經曰弟子自非赤心坦幽長苦靈囿肘伏師門頓首德宇者而洞經玉籙終不告兆也兆身無奇氣特鍾自然合神神光內照羽暉映玄太素生五藏七靈入泥丸骨有五帝之玉暉血有流金之浩泉如此皆天仙之相也自無此天相亦終不與此經師相遭遇矣受經盟誓割青破鐶啓約相授截帶骨親然後乃得行帝一之氣讀大洞真經太上玉籙焉經師源於本玄攝始氣以運幽拔滯路以通真啓雲津以告翹大渡越於水火必生明乎濟超為此經弟子者當苦心經戒尊奉師君饌膳同味甘苦分均始終鏡於神明嶮痾同於塗辛然後帝一盼善以恆坦之固太上揮匠以必成之輪心膂無鬲於所崇五藏不沈纍於泥丸於是氣遘晨霄德拔七玄世世生大福子孫常貴仙重玄纍萬萬方來植道根祖考反生胎太上輔兆神於是玉房明白九徊混分鏡心常一百靈歡然盈縮所苦常存師君大洞真經高上首篇三十九章畢於是焉受大洞真經三十九章太上大道君八景玉籙八風徘徊帝一之道太丹隱玄回元五通十二上願玄母八間先進洞房金華雌一九玄列紀靈書紫文鎮生五藏琅玕華丹者當破鐶割繩乃得傳之節度如左紫金為鐶鐶徑一寸截破一鐶分為兩半經師及弟子當各帶一半終身佩之青絲為繩綖長九尺各割半以纒繞縛此半鐶又合帶之青錦一尺八寸各分半為囊以盛此金半鐶及青絲繩矣分鐶繩各畢弟子三拜受經經師跪授之各心中存祝曰某甲今受大洞真經三十九章太上大道君八景玉籙當令身升紫虛上造仙宫七祖父母反胎攝生大福大慶世世來庭子孫繁盛千千華明受經無泄諷修玉章事事如法戒奉以保身形違戒背經世世生禍殃割絲截鐶上聞三清下告五嶽北帝三官畢
